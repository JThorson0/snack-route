<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0c0f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Snack Route</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#000;--surface:#121214;--surface2:#1c1c1f;--surface3:#2a2a2e;--line:#1f1f23;
  --text:#fff;--dim:#9a9aa3;--dim2:#5c5c66;--ink:#0a0a0a;
  --sc:#22e07a;              /* active store color — set per store at runtime */
  --go:#22e07a;--danger:#ff5a5f;--warn:#ffb020;
  --tabs-h:66px;--qa-h:108px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
  --r:24px;--rs:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
body{overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
kbd{font:inherit;background:var(--surface2);padding:1px 7px;border-radius:7px;color:var(--text);font-weight:700}
b{font-weight:800}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
@media (min-width:560px){
  body{background:#0e0e11}
  #app{left:50%;top:50%;transform:translate(-50%,-50%);width:412px;height:min(100%,900px);border-radius:32px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.7);background:var(--bg)}
}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}

/* ---------- big headers ---------- */
.hdr{flex:none;padding:calc(var(--sat) + 20px) 20px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hdr h1{font-size:34px;font-weight:900;margin:0;letter-spacing:-.03em;line-height:1}
.hdr .sub{color:var(--dim);font-size:13px;white-space:nowrap;padding-bottom:4px;font-weight:600}
.hdr .right{display:flex;align-items:center;gap:10px}
.hdr .ib{width:44px;height:44px;border-radius:14px;background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;transition:transform 80ms}
.hdr .ib:active{transform:scale(.92)}
.hdr .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hdr .ib[disabled]{opacity:.3}

/* ---------- store switcher ---------- */
.chips{flex:none;display:flex;gap:8px;padding:calc(var(--sat) + 12px) 16px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;background:var(--surface);color:var(--dim);
  font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em;transition:background 140ms,color 140ms,transform 80ms}
.chip:active{transform:scale(.96)}
.chip.active{color:var(--ink);background:var(--cc)}
.chip .n{font-size:12px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface3);color:var(--text);font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.chip.active .n{background:rgba(0,0,0,.22);color:var(--ink)}
.stitle{flex:none;margin:0 12px 10px;padding:18px 18px 16px;border-radius:var(--r);background:var(--sc);color:var(--ink);position:relative}
.stitle h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1.05;padding-right:104px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stitle .sum{display:flex;align-items:flex-end;gap:22px;margin-top:12px}
.stitle .sum .lg{display:flex;flex-direction:column;line-height:1}
.stitle .sum .lg .v{font-size:44px;font-weight:900;letter-spacing:-.05em}
.stitle .sum .lg .l{font-size:12px;font-weight:700;opacity:.7;margin-top:6px;letter-spacing:.02em}
.stitle .sum .lg.last .v{font-size:26px;opacity:.55;margin-bottom:2px}
.stitle .ib{position:absolute;top:14px;width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.18);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;transition:background 140ms,transform 80ms}
.stitle .ib:active{transform:scale(.92)}
.stitle .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stitle .clear{right:64px}
.stitle .mode{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.18);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;transition:background 140ms}
.stitle .mode.all{background:var(--ink);color:var(--sc)}
.stitle .mode svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- store sheets ---------- */
.track-wrap{flex:1;min-height:0;overflow:hidden;position:relative}
.track{display:flex;height:100%;width:100%;touch-action:pan-y;will-change:transform}
.pane{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;position:relative;padding:0 0 16px;display:flex;flex-direction:column}
.pane .list{flex:1}
.group{margin:0 0 6px}
.cat{position:sticky;top:0;z-index:1;background:var(--bg);width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px 10px 20px;min-height:52px;text-align:left;font-size:14px;font-weight:900;color:var(--text);letter-spacing:-.01em}
.cat::before{content:"";width:4px;height:22px;border-radius:2px;background:var(--sc);flex:none;margin-left:-8px}
.cat .cn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .cnt{font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap}
.cat .cnt b{color:var(--ink);background:var(--sc);border-radius:8px;padding:2px 7px;margin-right:6px;font-weight:900}
.cat .chev{width:32px;height:32px;border-radius:10px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;transition:transform 160ms}
.cat .chev svg{width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cat.closed .chev{transform:rotate(-90deg)}
.cat:active{background:var(--surface)}
.group[hidden]{display:none}
.rw{position:relative;overflow:hidden}
.rw + .rw .row::before{content:"";position:absolute;left:20px;right:0;top:0;height:1px;background:var(--line)}
.rw .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;
  background:var(--danger);color:#fff;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:0}
.rw.swiping .under{opacity:1}
.row{position:relative;display:flex;align-items:center;height:66px;padding:0 12px 0 20px;background:var(--bg);user-select:none;-webkit-user-select:none}
.row .prev{width:44px;flex:none;display:flex;align-items:center}
.row .prev span{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 5px;border-radius:10px;background:var(--surface2);color:var(--dim);line-height:1}
.row .prev span b{font-size:15px;font-weight:900;color:var(--text)}
.row .prev span i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;color:var(--dim)}
.row .body{flex:1;min-width:0;padding:0 10px 0 6px}
.row .name{font-size:16.5px;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.015em}
.row.on .name{color:var(--text);font-weight:800}
.row .item{font-size:12px;color:var(--dim2);margin-top:3px;letter-spacing:.06em;font-weight:600}
.row .item .noitem{font-style:italic;letter-spacing:0;font-weight:500}
.qc{display:flex;align-items:center;width:140px;height:46px;flex:none;border-radius:23px;background:var(--surface);justify-content:space-between;transition:background 140ms}
.row.on .qc{background:var(--sc)}
.st{width:46px;height:46px;border-radius:23px;color:var(--dim);display:flex;align-items:center;justify-content:center;transition:transform 80ms,background 80ms}
.st svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
.st:active{transform:scale(.86)}
.row .st[data-d="1"]{color:var(--text)}
.row.on .st{color:var(--ink)}
.row.on .st:active{background:rgba(0,0,0,.14)}
.cur{width:44px;text-align:center;font-size:20px;font-weight:900;color:var(--dim2);letter-spacing:-.03em}
.row.on .cur{color:var(--ink)}
.cur.bump{animation:bump 200ms cubic-bezier(.2,.8,.2,1)}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.rw.flash .row{animation:flash 700ms ease-out}
@keyframes flash{0%{background:var(--surface2)}100%{background:var(--bg)}}
.empty{padding:36px 28px;color:var(--dim);text-align:center;line-height:1.55;font-size:15px}
.empty .ico{width:72px;height:72px;border-radius:24px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px}
.empty .ico svg{width:32px;height:32px;stroke:var(--sc);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.empty b{color:var(--text)}
.empty .link{display:inline-flex;align-items:center;gap:8px;margin-top:18px;color:var(--text);font-weight:800;height:48px;padding:0 20px;border-radius:24px;background:var(--surface2)}

/* ---------- quick add composer ---------- */
.qa{flex:none;background:var(--bg);padding:0 12px 10px;height:var(--qa-h);display:flex;flex-direction:column;justify-content:flex-end}
.qa[hidden]{display:none}
.sugg{height:42px;display:flex;gap:6px;overflow-x:auto;align-items:center;scrollbar-width:none;padding:0 4px}
.sugg::-webkit-scrollbar{display:none}
.sugg .hint{color:var(--dim2);font-size:12.5px;white-space:nowrap;font-weight:600}
.sugg .hint kbd{background:var(--surface);color:var(--dim)}
.sugg .ok{color:var(--dim);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-weight:600}
.sugg .ok b{color:var(--text)}
.sugg .ok::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--go);flex:none;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12l5 5L20 7'/></svg>") center/12px no-repeat,linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude}
.sg{flex:none;height:34px;padding:0 6px 0 13px;border-radius:17px;background:var(--surface2);color:var(--text);font-size:14px;
  display:flex;align-items:center;gap:8px;white-space:nowrap;font-weight:700}
.sg.first{background:var(--text);color:var(--ink)}
.sg .q{font-size:12px;font-weight:900;min-width:24px;height:22px;padding:0 7px;border-radius:11px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center}
.sg.first .q{background:var(--sc);color:var(--ink)}
.sg .last{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.02em}
.sg.first .last{color:var(--ink);opacity:.6}
.sg.create,.sg.undo{padding-right:13px}
.sg.undo{color:var(--ink);background:var(--sc);margin-left:auto;font-weight:900}
.qa-row{position:relative;display:flex;margin-top:2px}
.qa-row .plus{position:absolute;left:18px;top:0;height:54px;display:flex;align-items:center;color:var(--dim);pointer-events:none}
.qa-row .plus svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
.qa-row input{flex:1;min-width:0;height:54px;border-radius:27px;border:0;background:var(--surface);padding:0 64px 0 46px;font-size:17px;font-weight:600;outline:none;transition:background 120ms,box-shadow 120ms}
.qa-row input:focus{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--sc)}
.qa-row input::placeholder{color:var(--dim2);font-weight:600}
.qa-row button{position:absolute;right:5px;top:5px;width:44px;height:44px;border-radius:22px;background:var(--sc);color:var(--ink);display:flex;align-items:center;justify-content:center;transition:transform 80ms}
.qa-row button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.qa-row button:active{transform:scale(.88)}

/* ---------- tab bar ---------- */
.tabs{flex:none;display:flex;height:calc(var(--tabs-h) + var(--sab));padding:8px 8px var(--sab);background:var(--bg);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim2);font-size:11px;font-weight:800;letter-spacing:.01em}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 120ms}
.tab.active{color:var(--text)}
.tab.active svg{stroke-width:2.6;transform:translateY(-1px)}
.tab:active svg{transform:scale(.9)}

/* ---------- toast ---------- */
.toast{position:absolute;left:12px;right:12px;bottom:calc(var(--tabs-h) + var(--sab) + 10px);z-index:50;background:var(--text);
  color:var(--ink);border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:700;box-shadow:0 12px 34px rgba(0,0,0,.55)}
.toast[hidden]{display:none}
body.has-qa .toast{bottom:calc(var(--tabs-h) + var(--sab) + var(--qa-h) + 2px)}
.toast .msg{flex:1;min-width:0}
.toast button{color:var(--ink);font-weight:900;height:44px;padding:0 12px;margin:-10px -12px -10px 0;text-decoration:underline;text-underline-offset:3px}
.toast button[hidden]{display:none}

/* ---------- sheets ---------- */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--surface);border-radius:28px 28px 0 0;max-height:92%;display:flex;flex-direction:column;padding-bottom:var(--sab);will-change:transform}
.sheet.full{height:100%;max-height:100%;border-radius:0;background:var(--bg);padding-top:var(--sat)}
.sheet-head{padding:10px 20px 8px;touch-action:none;flex:none;user-select:none;-webkit-user-select:none}
.handle{width:40px;height:5px;border-radius:3px;background:var(--surface3);margin:0 auto 16px}
.sheet-title{font-weight:900;font-size:24px;letter-spacing:-.03em}
.sheet-sub{color:var(--dim);font-size:13.5px;margin-top:4px;font-weight:600}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 20px;flex:1;min-height:0}
.sheet.enter{animation:up 260ms cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(100%)}}

/* ---------- buttons & forms ---------- */
.btn{height:54px;padding:0 20px;border-radius:27px;background:var(--surface2);font-weight:800;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform 80ms,filter 80ms;letter-spacing:-.01em}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--text);color:var(--ink)}
.btn.go{background:var(--go);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;color:var(--dim)}
.btn.block{width:100%}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.35}
.btnrow{display:flex;gap:8px;margin-top:16px}
.btnrow .btn{flex:1}
.fld{display:block;margin-bottom:14px}
.fld > span{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;font-weight:700}
.fld input,.fld textarea{width:100%;height:50px;border-radius:14px;border:0;background:var(--bg);padding:0 16px;font-size:16px;font-weight:600;outline:none;box-shadow:inset 0 0 0 1px var(--line)}
.fld textarea{height:auto;min-height:110px;padding:12px 16px;resize:vertical;line-height:1.4}
.fld input:focus,.fld textarea:focus{box-shadow:inset 0 0 0 2px var(--sc)}
.fld .help{font-size:12px;color:var(--dim2);margin-top:6px;line-height:1.4}
.fld .help code{color:var(--dim)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0}
.sw{width:40px;height:40px;border-radius:20px;background:var(--c);transition:transform 80ms;display:flex;align-items:center;justify-content:center}
.sw.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.sw svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;display:none}
.sw.on svg{display:block}

/* ---------- master ---------- */
.mlist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;position:relative;-webkit-overflow-scrolling:touch;padding:0 0 16px}
.ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--dim);font-size:12px;padding-bottom:8px;will-change:height;font-weight:700}
.ptr.spin{transition:height 180ms ease}
.hero{margin:0 12px 14px;padding:22px 20px 18px;border-radius:var(--r);background:var(--text);color:var(--ink);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .main .v{font-size:64px;font-weight:900;letter-spacing:-.06em;line-height:.9}
.hero .main .l{font-size:14px;font-weight:800;margin-top:8px;opacity:.75}
.hero .side{text-align:right;font-size:13px;font-weight:800;opacity:.75;line-height:1.5}
.hero .side b{font-size:22px;display:block;opacity:1;letter-spacing:-.03em;line-height:1.1}
.hero .side .bar{display:flex;gap:3px;justify-content:flex-end;margin-top:8px}
.hero .side .bar i{width:14px;height:6px;border-radius:3px;background:rgba(0,0,0,.15)}
.hero .side .bar i.on{background:var(--c)}
.mrw{position:relative;overflow:hidden}
.mrw .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:22px;background:var(--danger);color:#fff;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:0}
.mrw.swiping .under{opacity:1}
.mrow{position:relative;display:flex;align-items:center;padding:12px 12px 12px 20px;gap:12px;min-height:66px;background:var(--bg);user-select:none;-webkit-user-select:none}
.mrw + .mrw .mrow::before{content:"";position:absolute;left:20px;right:0;top:0;height:1px;background:var(--line)}
.mlist{touch-action:pan-y}
.swipe-hint{padding:10px 20px 0;color:var(--dim2);font-size:12px;font-weight:600;text-align:center}
.mrow .body{flex:1;min-width:0}
.mrow .name{font-weight:800;font-size:16.5px;letter-spacing:-.015em}
.mrow .item{font-size:12px;color:var(--dim2);letter-spacing:.06em;margin-top:2px;font-weight:600}
.mrow .by{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mrow .by span{font-size:12px;color:var(--text);background:var(--surface);border-radius:8px;padding:3px 8px 3px 6px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.mrow .by span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.mrow .by span b{font-weight:900;margin-left:1px}
.mrow .tot{min-width:56px;height:46px;padding:0 12px;border-radius:23px;background:var(--text);color:var(--ink);font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:-.03em}
.actions{flex:none;display:flex;gap:8px;padding:8px 12px 10px;background:var(--bg)}
.actions .btn{flex:1}

/* ---------- step-through ---------- */
.step{display:flex;flex-direction:column;height:100%;padding:0 16px;gap:12px}
.step .pos{color:var(--dim);font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.step .pname{font-size:28px;font-weight:900;line-height:1.05;min-height:60px;letter-spacing:-.03em;margin-top:6px}
.step .pcat{color:var(--dim);font-size:13.5px;margin-top:6px;font-weight:700}
.big{flex:1;min-height:0;border-radius:28px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px;transition:transform 100ms,background 120ms}
.big .lbl{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.big .val{font-size:52px;font-weight:900;letter-spacing:-.01em;line-height:1.05}
.big .val.missing{font-size:17px;color:var(--dim);font-weight:600;font-style:italic}
.big.cases{background:var(--go);color:var(--ink)}

.filebtn input{position:absolute;inset:0;opacity:0;font-size:0}

function scoreProduct(p, q) {
  let best = 0;
  const keys = [norm(p.name)].concat(p.aliases, p.desc ? [norm(p.desc)] : []);
  const qw = q.split(' ');
  for (const k of keys) {
    if (!k) continue;
    if (k === q) { best = 100; break; }
    if (k.startsWith(q)) { best = Math.max(best, 80 - Math.min(19, k.length - q.length)); continue; }
    const words = k.split(' ');
    if (qw.every(t => words.some(w => w.startsWith(t)))) best = Math.max(best, 60 - Math.min(19, Math.max(0, k.length - q.length)));
    else if (k.includes(q)) best = Math.max(best, 40);
  }
  const item = p.item;
  if (item && /^\d+$/.test(q)) {
    if (item === q) best = Math.max(best, 98);            // exact string compare — never numeric
    else if (q.length >= 3 && item.startsWith(q)) best = Math.max(best, 70);
  }
  return best;
}

  if (m && +m[2] > 0) out.push({ name: m[1].trim(), qty: +m[2], literal: false });

}

      const prev = map.get(p.id);

    }

    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup downloaded');
  } catch (e) { toast('Download failed — use Copy JSON instead'); }
}
function importJSON(text) {
  let obj; try { obj = JSON.parse(text); } catch (e) { toast('That is not valid JSON'); return; }
  const data = obj && obj.data && obj.data.stores ? obj.data : obj;
  if (!data || !Array.isArray(data.stores) || !Array.isArray(data.products)) { toast('That file is not a Snack Route backup'); return; }
  const inc = migrate(clone(data));
  const cases = Object.values(inc.orders.current).reduce((a, st) => a + Object.values(st).reduce((x, y) => x + y, 0), 0);
  confirmSheet({ title: 'Replace everything with this backup?', body: `The backup has <b>${inc.products.length} products</b>, ${inc.stores.length} stores and ${cases} cases on its current order${obj.exportedAt ? ' (exported ' + esc(obj.exportedAt.slice(0, 10)) + ')' : ''}. Your data on this phone is replaced.`, okLabel: 'Import', danger: true, onOk: () => { S = inc; save(); renderAll(); toast('Backup imported'); } });
}
function openPasteImport() {
  const sh = openSheet({ title: 'Paste a backup', html: `<label class="fld"><span>Backup JSON</span><textarea id="paste-t" autocapitalize="none" spellcheck="false"></textarea></label><div class="btnrow"><button type="button" class="btn primary" id="paste-go">Import</button></div>` });
  $('#paste-go', sh.el).addEventListener('click', () => { const t = $('#paste-t', sh.el).value; sh.close(); importJSON(t); });
  setTimeout(() => $('#paste-t', sh.el).focus(), 50);
}

// ===================== boot =====================
function renderAll() {
  buildTrack(); goTo(idx, false); renderChips(); sugg.innerHTML = HINT;
  if (!views.master.hidden) renderMaster();
  if (!views.cutoffs.hidden) renderCutoffs();
  if (!views.setup.hidden) renderSetup();
}
load();
// ?demo — load a realistic "last order was submitted and rolled over" state so the two-column view can be seen.
// One-shot: the param is removed from the URL. Setup → Reset clears it again.
if (new URLSearchParams(location.search).has('demo')) {
  const byItem = new Map(); S.products.forEach(p => { if (p.item && !byItem.has(p.item)) byItem.set(p.item, p.id); });
  const only = o => { const out = {}; for (const sid in o) { out[sid] = {}; for (const item in o[sid]) { const pid = byItem.get(item); if (pid) out[sid][pid] = o[sid][item]; } } return out; };
  S.orders.previous = only({
    s1: { '115344': 6, '107866': 2, '115345': 2, '089370': 3, '115007': 2, '080060': 1, '080040': 2, '107361': 2 },
    s2: { '115344': 4, '107866': 1, '114597': 2, '103405': 1, '080060': 2 },
    s3: { '115344': 3, '115345': 1, '010160': 2, '113282': 1, '080090': 2 },
    s4: { '115344': 5, '115353': 2, '497500': 1, '108481': 2, '22752': 1 },
    s5: { '115344': 2, '107866': 2, '080030': 1, '080060': 1, '107361': 3 },
    s6: { '115344': 2, '114657': 2, '107178': 1, '114658': 2 },
    s7: { '115344': 3, '114657': 1, '114658': 1, '107361': 1 }
  });
  S.orders.current = only({ s1: { '115344': 2, '080040': 1 } });
  S.lastRollover = Date.now() - 2 * 86400000;
  S.rolloverBackup = null;
  S.ui.store = S.stores[0].id; S.ui.tab = 'stores'; S.ui.showAll = false;
  save();
  history.replaceState(null, '', location.pathname);
}
renderAll();
showView(S.ui.tab);

// update-ready notice (the SW takes over on next load; nothing here blocks anything)
if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(reg => {
  reg.addEventListener('updatefound', () => {
    const w = reg.installing; if (!w) return;
    w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Update ready', 'Reload', () => location.reload(), 8000); });
  });
}).catch(() => {});
})();
</script>
